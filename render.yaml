services:
  - type: web
    name: job-timeline-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: APP_ACCESS_PASSWORD
        sync: false
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        generateValue: true
