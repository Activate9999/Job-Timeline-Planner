services:
  - type: web
    name: job-timeline-planner
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: job-timeline-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: APPLICATION_DATABASE_PATH
        value: /var/data/job_timeline.sqlite3
      - key: GOOGLE_TOKEN_PATH
        value: /var/data/google-token.json
      - key: GOOGLE_OAUTH_CLIENT_CONFIG
        sync: false
